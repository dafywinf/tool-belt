[tool.poetry]
name = "validation-app"
version = "0.1.0"
description = "Minimal FastAPI validation app for devcontainer template validation"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.32"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
httpx = "^0.28"
ruff = "^0.8"
allure-pytest = "^2.13"

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "host_platform: requires the host docker compose platform services to be running",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
